# Scrapes the exporter service, which reads the LATEST row of
# data/monitoring/metrics_timeseries.parquet and the latest alerts_log.jsonl
# record and exposes them as Prometheus gauges.
#
# The full Jul-Dec 2024 backtest HISTORY is not scraped -- it's loaded once,
# before Prometheus first starts, via the backfill procedure (see
# scripts/backfill_prometheus.py and the README in this folder). This scrape
# config only handles data going forward from whenever you start the stack.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "surge_drift_monitor_exporter"
    static_configs:
      - targets: ["exporter:8000"]