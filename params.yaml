# ============================================================
# Surge-Price Drift Monitor — Central Configuration
# Every tunable parameter for every pipeline stage lives here.
# Never hardcode thresholds, dates, or feature lists in source.
# ============================================================

data:
  # NYC TLC Yellow Taxi trip data, sampled months for fast iteration.
  # Full training window per project spec is Jan 2022 - Dec 2023;
  # we sample 6 representative months to keep Phase 1 iteration fast.
  # Swap this list to a full 24-month range later with no code changes.
  training_months:
    - "2022-01"   # winter
    - "2022-04"   # spring
    - "2022-07"   # summer
    - "2022-10"   # fall
    - "2023-01"   # winter, year 2 (year-over-year comparison)
    - "2023-07"   # summer, year 2 (year-over-year comparison)
  production_months:
    - "2024-07"
    - "2024-08"
    - "2024-09"
    - "2024-10"
    - "2024-11"
    - "2024-12"

  tlc_base_url: "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{month}.parquet"
  zone_lookup_url: "https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv"

  raw_dir: "data/raw"
  processed_dir: "data/processed"
  reference_dir: "data/reference"

  # NYC-wide weather (Open-Meteo archive), joined on timestamp only.
  # Zone-level weather is out of scope for Phase 1 — flagged as a
  # future enhancement, not needed for a first working model.
  weather:
    latitude: 40.7128
    longitude: -74.0060
    archive_base_url: "https://archive-api.open-meteo.com/v1/archive"
    hourly_vars:
      - "temperature_2m"
      - "precipitation"
      - "windspeed_10m"
  raw_production_dir: "data/raw_production"

features:
  # Target: pickup count per (zone, hour) bucket.
  target_col: "trip_count"

  time_features:
    - "hour_of_day"
    - "day_of_week"
    - "month"
    - "is_weekend"

  lag_features:
    lag_hours: [1, 24, 168]   # 1h, 24h, 1 week

  rolling_features:
    windows_hours: [3, 24]

  categorical_features:
    - "zone_id"

  # Minimum trips/hour for a zone to be included — drops near-zero
  # zones that add noise without meaningful demand signal.
  min_zone_hourly_volume: 1

split:
  train_end_date: "2023-05-31"   # last of the sampled months used for training
  val_start_date: "2023-06-01"
  val_end_date: "2023-07-31"
  val_fraction_fallback: 0.2      # used if date-based split leaves too little val data

model:
  type: "lightgbm"
  params:
    objective: "regression"
    metric: "rmse"
    num_leaves: 63
    learning_rate: 0.05
    n_estimators: 500
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
  early_stopping_rounds: 30

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "surge-demand-forecast"
  registered_model_name: "surge-demand-lgbm"
  champion_alias: "champion"
  challenger_alias: "challenger"

reference_snapshot:
  # Percentiles computed per numeric feature for the frozen baseline.
  percentiles: [1, 5, 25, 50, 75, 95, 99]
  histogram_bins: 20

serving:
  model_refresh_interval_seconds: 300
  historical_store:
    sqlite_path: "data/serving/demand_history.db"
  prediction_log:
    output_dir: "data/predictions"
    flush_every_n_records: 50
    flush_interval_seconds: 30
  seed_source_path: "data/processed/features.parquet"
  production_source_path: "data/processed/production_features.parquet"
  weather_cache_path: "data/processed/weather_hourly.parquet"
  replay:
    base_url: "http://127.0.0.1:8000"
    delay_seconds_per_hour: 0
    progress_log_every_n_hours: 24 

monitoring:
  reference_snapshot_path: "data/reference/reference_snapshot_current.json"
  prediction_correlation_baseline_path: "data/reference/prediction_correlation_baseline.json"
 
  inputs:
    predictions_dir: "data/predictions"          # partitioned date=*/*.parquet
    sqlite_path: "data/serving/demand_history.db" # for actuals join
 
  outputs:
    metrics_timeseries_path: "data/monitoring/metrics_timeseries.parquet"
    alerts_log_path: "data/monitoring/alerts_log.jsonl"
    bias_state_path: "data/monitoring/zone_bias_consecutive_state.json"  # persists consecutive-breach
                                                                          # counts between separate
                                                                          # scheduled-job invocations
                                                                          # (backtest keeps this in-memory
                                                                          # instead, since it's one process)
 
  cadence:
    granularity_hours: 1          # hourly, per your decision — finer TTD resolution
 
  windows:
    drift_window_hours: 720       # widened again from 168h to 720h (30 days). 168h fixed
                                   # day_of_week (needs 1 full weekly cycle) but temperature/
                                   # windspeed are temporally autocorrelated continuous features --
                                   # any short window only covers a narrow local slice of the
                                   # reference's full annual range, inflating PSI regardless of
                                   # real drift (confirmed via backtest: PSI stayed elevated in
                                   # EVERY month, not rising toward winter -- ruling out real
                                   # seasonal mismatch as the explanation). 720h helps but likely
                                   # won't fully resolve this for weather -- see
                                   # psi_alert_threshold_overrides below.
    rmse_windows_hours:
      - 24
      - 168     # 7d
      - 720     # 30d
    correlation_baseline_window_hours: 720   # first 30 days of production, used once to seed baseline
 
  drift_thresholds:
    psi_top_n_features: 10        # PSI computed only on these; list below
    psi_features:
      - "lag_1h"
      - "lag_24h"
      - "lag_168h"
      - "rolling_mean_3h"
      - "rolling_mean_24h"
      - "temperature_2m"
      - "precipitation"
      - "windspeed_10m"
      - "hour_of_day"
      - "zone_id"
    psi_alert_threshold: 0.25
    psi_trigger_exempt:                 # NEW: still computed & logged (visible in
                                         # metrics_timeseries.parquet for Grafana), but
                                         # excluded from deciding drift_breached.
      - "temperature_2m"
      - "windspeed_10m"
      # Three rounds of backtest evidence (24h->168h->720h window,
      # 0.25->1.5 threshold) showed these two features' PSI stays
      # persistently elevated with NO time trend across all 6 months --
      # the signature of a structural PSI limitation on temporally-
      # autocorrelated continuous features vs. a full-period reference,
      # not real drift. KNOWN LIMITATION / documented technical debt: the
      # correct fix is a seasonally-stratified reference (per-calendar-
      # month baselines). Out of scope for this phase.
    psi_alert_threshold_overrides: {}   # no longer needed now that these two are trigger-exempt;
                                         # left as an empty, working mechanism in case a future
                                         # feature needs a per-feature threshold instead of a
                                         # full exemption.
    label_kl_alert_threshold: 0.15
    spearman_drop_pct_threshold: 0.30
    null_rate_multiplier_threshold: 2.0
    histogram_n_bins: 20          # used only if reference snapshot lacks pre-built bin edges for a feature
 
  performance_thresholds:
    zone_bias_pct_threshold: 0.25
    zone_bias_consecutive_hours: 3
    calibration_error_threshold: 0.10
    prediction_variance_multiplier: 2.0
 
  retrain_trigger:
    # Two-stage: BOTH must be true in the same evaluation to fire.
    # Phase 3 only logs/flags this trigger — Phase 4 consumes it.
    require_drift_breach: true
    require_performance_degradation: true
 
# ---------------------------------------------------------------------------
# PHASE 4 — merge this as a second new top-level key, alongside `monitoring:`
#
# Deliberately small: mlflow_tracking_uri/model_name/champion_alias and the
# LightGBM hyperparameters are NOT duplicated here. They're read directly
# from your EXISTING params["mlflow"] and params["model"]["params"] /
# params["model"]["early_stopping_rounds"] sections at runtime -- the same
# ones train.py already reads -- so there is exactly one source of truth
# for training config, not two that could silently drift apart.
# ---------------------------------------------------------------------------
retraining:
  lookback_days: 30
  holdout_days: 5                          # last N days of the lookback window held out for
                                            # champion-challenger comparison (time-based, not random)
  min_improvement_pct: 0.05                # challenger must beat champion RMSE by >5% to promote
  cooldown_days: 7                         # minimum gap after an actual PROMOTION, even if
                                            # trigger keeps firing every hour after it
  failed_attempt_cooldown_days: 1          # minimum gap after a FAILED (non-promoting) attempt --
                                            # separate, shorter cooldown. Added after a real backtest
                                            # showed 683 retrain attempts / 0 promotions with NO
                                            # cooldown between them (last_retrain_as_of only updated
                                            # on promotion) -- 683 wasted LightGBM training runs in a
                                            # single 6-week window. This stops that: once a challenger
                                            # fails to beat the champion, wait at least this long
                                            # before trying again, even if the trigger stays hot.
  outputs:
    retrain_events_path: "data/monitoring/retrain_events.jsonl"